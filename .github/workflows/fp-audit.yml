name: False-positive audit

# Scans large sets of known-clean operating-system and application files with every engine (including the
# full YARA Forge rule set) and fails if anything would be auto-quarantined. Heuristic-only findings are
# listed in the job summary for review.

on:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            paths: C:/Windows/System32 "C:/Program Files"
          - os: macos-latest
            paths: /Applications /usr/bin /usr/sbin /usr/lib
          - os: ubuntu-latest
            paths: /usr/bin /usr/sbin /usr/lib/python3 /usr/share
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Audit
        shell: bash
        run: python tools/fp_audit.py --update --max-files 20000 ${{ matrix.paths }}
