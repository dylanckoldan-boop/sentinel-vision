# Builds the website in site/, checks it (links, alt text, contrast, axe-core accessibility in light and dark mode,
# 320 px reflow, no third-party requests) and publishes it with GitHub Pages from main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "requirements/site.lock"
      - "docs/screenshots/**"
      - "packaging/assets/icon.png"
      - "src/sentinel_vision/__init__.py"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "src/sentinel_vision/trust.py"
      - ".github/workflows/pages.yml"
  # a new release changes the version and the verified installer fingerprint the site shows
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --quiet --require-hashes -r requirements/site.lock
          python -m pip install --quiet --require-hashes -r requirements/sign.lock  # signature check (SV-C04)
          python -m playwright install --with-deps chromium
          npm ci --prefix site/a11y --ignore-scripts --no-audit --no-fund  # exact, hash-checked (SV-B02)
      - name: Build (after verifying the latest release's signature) and check links, images, alt text and contrast
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python site/build.py --check
      - name: Accessibility checks in a browser
        run: python site/check_a11y.py site/a11y/node_modules/axe-core/axe.min.js
      - name: Record what was built
        run: cd site/public && sha256sum *.html > "$RUNNER_TEMP/manifest.txt" && cat "$RUNNER_TEMP/manifest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-manifest
          path: ${{ runner.temp }}/manifest.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # audit finding SV-C05: the live site serves exactly what was built and checked
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-manifest
      - name: Every live page matches the build
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -u
          for attempt in $(seq 1 12); do
            bad=0
            while read -r sum name; do
              url="${SITE%/}/$name"
              got=$(curl -fsS --retry 2 -H 'Cache-Control: no-cache' "$url?nocache=$GITHUB_RUN_ID-$attempt" | sha256sum | cut -d' ' -f1) || got=fetch-failed
              if [ "$got" != "$sum" ]; then echo "mismatch: $url ($got)"; bad=1; fi
            done < manifest.txt
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE%/}/")
            [ "$code" = 200 ] || { echo "home page HTTP $code"; bad=1; }
            [ "$bad" = 0 ] && { echo "all $(wc -l < manifest.txt) pages match the build"; exit 0; }
            echo "attempt $attempt: waiting for the CDN"; sleep 60
          done
          echo "::error::the live site does not match what was built"; exit 1
