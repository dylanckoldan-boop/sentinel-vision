name: Integration

# Live checks against the real threat feeds and services (they can't be reached from every development
# environment, and they change without notice), on all three operating systems.

on:
  schedule:
    - cron: "41 5 * * 3"  # weekly, Wednesday 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  online:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SV_ONLINE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: Live service tests
        shell: bash
        run: |
          set -o pipefail
          pytest -v -s -rs -m online -p no:cacheprovider 2>&1 | tee pytest.log
      - name: Report failure details
        if: failure()
        shell: bash
        run: python tools/annotate_failure.py pytest.log "Integration on ${{ matrix.os }}"
      - name: Report summary
        if: success()
        shell: bash
        run: |
          grep -E "^(OK |ERR)" pytest.log > feeds.txt || true
          python - <<'PY'
          text = open("feeds.txt", encoding="utf-8", errors="replace").read() + "\n" + open("pytest.log", encoding="utf-8", errors="replace").read().splitlines()[-1]
          print("::notice title=Integration (${{ matrix.os }})::" + text.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
