name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests tools site
      - run: ruff format --check src tests tools site

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pytest -v -rs -p no:cacheprovider 2>&1 | tee pytest.log
      - name: Report failure details
        if: failure()
        shell: bash
        run: python tools/annotate_failure.py pytest.log "Tests on ${{ matrix.os }} / Python ${{ matrix.python }}"
      - name: Report summary
        if: success()
        shell: bash
        run: python tools/annotate_failure.py pytest.log "Tests on ${{ matrix.os }} / Python ${{ matrix.python }}" --summary
